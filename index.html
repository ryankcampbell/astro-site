<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#312e81">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Astronomy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="style.css">
<script>try{var t=JSON.parse(localStorage.getItem('astro.theme')||'null');if(!t&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>

<div id="boot"><div><img src="icons/icon-192.png" alt="" width="52" height="52"><p id="bootmsg">Loading&hellip;</p></div></div>

<header id="top">
  <button class="iconbtn" id="backbtn" aria-label="Back to the day list" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <a class="brand" href="#" id="brand"><img src="icons/icon-192.png" alt="" class="mark"><div><b>Astronomy</b><span>NWA · Block 1</span></div></a>
  <div id="searchwrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" placeholder="Search days, pages, apps&hellip;" autocomplete="off" spellcheck="false" aria-label="Search">
    <kbd>/</kbd>
    <div id="results" role="listbox"></div>
  </div>
  <div class="spacer">
    <span class="pillstat" id="netpill"><span class="dot"></span><span id="nettext">Checking&hellip;</span></span>
    <button class="iconbtn" id="themebtn" title="Night mode" aria-label="Toggle night mode">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div id="main">
  <nav id="rail" aria-label="Units and days">
    <div id="units" role="tablist"></div>
    <div id="railbody"></div>
    <div id="railfoot"><button class="btn-2 small" id="savebtn"></button></div>
  </nav>
  <main id="reader">
    <div id="dochead"></div>
    <div id="chips" role="tablist"></div>
    <div id="stage"></div>
  </main>
</div>

<div id="toast"><span id="toastmsg"></span><button id="toastbtn">Reload</button></div>

<script src="katex/katex.min.js"></script>
<script src="katex/auto-render.min.js"></script>
<script src="study.js"></script>
<script src="app.js"></script>
</body>
</html>
